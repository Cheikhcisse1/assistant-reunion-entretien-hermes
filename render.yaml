services:
  - type: web
    name: hermes-assistant
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_MODE         # démo ouverte à tous, sans mot de passe
        value: "1"
      - key: DEFAULT_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY      # clé gratuite (aistudio.google.com/apikey), à saisir dans Render, jamais dans Git
        sync: false
      - key: RATE_LIMIT_PER_HOUR # requêtes IA max par visiteur et par heure
        value: "20"
